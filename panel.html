<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人信息面板</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="panel-container" id="container">

  <!-- 账号状态 -->
  <div class="panel-section">
    <div class="panel-section-title">账号</div>
    <div class="card" id="accountCard">
      <div class="skeleton-line" style="width:60%;height:14px;margin-bottom:8px;"></div>
      <div class="skeleton-line" style="width:90%;height:12px;margin-bottom:6px;"></div>
      <div class="skeleton-line" style="width:70%;height:12px;"></div>
    </div>
  </div>

  <!-- 我的预约（后端无独立API，引导对话查询） -->
  <div class="panel-section">
    <div class="panel-section-title">我的预约</div>
    <div id="reservationList">
      <div class="card js-reservation-trigger" style="cursor:pointer;">
        <div class="empty-state">
          <span id="reservationIcon"></span>
          <div>点击查看我的预约</div>
          <div style="margin-top:4px;font-size:11px;">在对话框输入「我的预约」</div>
        </div>
      </div>
    </div>
  </div>


</div>

<script src="shared.js"></script>
<script>
(function() {
  const { apiGet, apiPost, ICONS, escapeHtml, sendToParent, MSG, MSG_FROM_PARENT, onParentMessage, setToken, clearToken, triggerFlow } = window.LibPanel;

  // ---------- 显示模式（URL 参数 mode，2026-08-24）----------
  // login：登录专注视图（账号管理任务流嵌入节点用）——只显示账号卡片，隐藏其余三卡片
  // view ：只读视图（右侧常驻 iframe 用）——未绑定只显示警告+触发按钮，不渲染绑定表单
  // 默认 ：完整面板（其他任务流嵌入 / 直接访问）
  const MODE = new URLSearchParams(location.search).get('mode') || '';
  if (MODE === 'login') {
    document.querySelectorAll('.panel-section').forEach((sec, idx) => {
      if (idx > 0) sec.style.display = 'none';
    });
  }

  // ---------- 渲染账号状态 ----------
  // 后端 GET /api/status 返回：
  //   未绑定: {"code":0, "bound":false}
  //   已绑定: {"code":0, "bound":true, "maskedName":"张某某"}
  function renderAccount(resp) {
    const card = document.getElementById('accountCard');

    // API 调用失败（FC 不可达/超时/网络中断）——附重试按钮，免用户重开页面/重说指令
    if (!resp) {
      card.innerHTML = `
        <div class="card-header">${ICONS.user} 账号状态</div>
        <div class="alert alert-warning">
          <span>${ICONS.alert}</span>
          <div>无法连接服务器，请稍后重试</div>
        </div>
        <button type="button" class="btn btn-block" style="margin-top:10px;" id="retryStatusBtn">重试连接</button>`;
      card.querySelector('#retryStatusBtn').addEventListener('click', () => refreshAll());
      return;
    }

    // code 非 0
    if (resp.code !== 0) {
      card.innerHTML = `
        <div class="card-header">${ICONS.user} 账号状态</div>
        <div class="alert alert-warning">
          <span>${ICONS.alert}</span>
          <div>${escapeHtml(resp.msg || '查询失败')}</div>
        </div>
        <button type="button" class="btn btn-block" style="margin-top:10px;" id="retryStatusBtn">重试</button>`;
      card.querySelector('#retryStatusBtn').addEventListener('click', () => refreshAll());
      return;
    }

    // ① 只读模式（view，右侧常驻 iframe）且未绑定：只显示警告 + 触发按钮，不渲染表单
    //    原因：侧边常驻 iframe 的 URL 不支持平台变量注入（2026-08-24 实测确认），
    //    uid 由 localStorage 身份自举恢复（shared.js，绑定过即正确）；但自举失效时
    //    （清数据/换设备/多账号）仍会回落 test_user——只读设计使 uid 即使错误也无
    //    副作用（无表单可提交），按钮走 triggerFlow 在对话区触发账号管理任务流
    if (MODE === 'view' && !resp.bound) {
      card.innerHTML = `
        <div class="card-header">${ICONS.user} 账号状态</div>
        <div class="alert alert-warning" style="margin-bottom:10px;">
          <span>${ICONS.alert}</span>
          <div>未绑定图书馆账号，暂无法使用预约/抢座功能</div>
        </div>
        <div style="font-size:var(--text-sm);color:var(--color-text-secondary);margin-bottom:10px;">
          为保证账号安全，绑定请在对话区完成。点击下方按钮，在对话区打开的绑定面板中输入学号密码
        </div>
        <button type="button" class="btn btn-primary btn-block js-go-bind">去绑定账号</button>`;
      card.querySelector('.js-go-bind').addEventListener('click', () => {
        // 配置了真实 taskId 时直接触发任务流，否则向对话区发送「绑定账号」语义触发
        triggerFlow('bind');
      });
      return;
    }

    // ② 完整/登录模式：未绑定，或已绑定但本机无凭证（换设备 / 清除浏览器数据 /
    //    其他通道绑定产生的同步断层）→ 渲染绑定表单：重新提交走 upsert 自动轮换
    //    凭证，本机即时恢复（view 模式不进此分支——只读，凭证同步走对话区登录入口）
    if (MODE !== 'view' && (!resp.bound || !window.LibPanel.hasCredential())) {
      const needSync = Boolean(resp.bound);
      const tip = needSync
        ? `已绑定（${escapeHtml(resp.maskedName || '--')}），但本设备未持有凭证（换设备或清除浏览器数据后会出现）。在下方重新输入账密即可同步，凭证自动轮换，其余设置不受影响`
        : '未绑定图书馆账号，在下方表单直接绑定';
      card.innerHTML = `
        <div class="card-header">${ICONS.user} 账号状态</div>
        <div class="alert alert-warning" style="margin-bottom:10px;">
          <span>${ICONS.alert}</span>
          <div>${tip}</div>
        </div>
        <form id="bindForm" autocomplete="off" novalidate>
          <div class="form-field">
            <label class="form-label" for="bindUsername">学号</label>
            <input class="form-input" id="bindUsername" type="text" inputmode="numeric" maxlength="20"
                   placeholder="图书馆系统登录学号" autocomplete="off" required>
          </div>
          <div class="form-field">
            <label class="form-label" for="bindPassword">密码</label>
            <div class="pwd-wrap">
              <input class="form-input" id="bindPassword" type="password" maxlength="64"
                     placeholder="图书馆系统密码" autocomplete="new-password" required>
              <button type="button" class="pwd-toggle" aria-label="显示密码" title="显示密码">${ICONS.eye}</button>
            </div>
          </div>
          <div class="form-field">
            <label class="form-label" for="bindPushplus">PushPlus Token（可选）</label>
            <input class="form-input" id="bindPushplus" type="text"
                   placeholder="抢座结果微信推送用，可留空" autocomplete="off">
          </div>
          <label class="form-check" style="margin-bottom:10px;">
            <input type="checkbox" id="bindRemember"> 记住密码（AES 加密存储，每日自动抢座需要）
          </label>
          <button type="submit" class="btn btn-primary btn-block" id="bindSubmitBtn">绑定</button>
          <div class="form-msg" id="bindMsg"></div>
        </form>
        <div class="form-footnote">绑定后凭证自动保存在本浏览器，下次打开免重复绑定</div>`;
      setupBindForm(card);
      return;
    }

    // 已绑定（字段是 maskedName，不是 masked）
    card.innerHTML = `
      <div class="card-header">${ICONS.user} 账号状态</div>
      <div class="list-item">
        <span class="list-item-label">学号</span>
        <span class="list-item-value">${escapeHtml(resp.maskedName || '--')}</span>
      </div>
      <div class="list-item">
        <span class="list-item-label">状态</span>
        <span class="list-item-value"><span class="badge badge-success">已绑定</span></span>
      </div>
      <button class="btn btn-block js-unbind" style="margin-top:10px;">解绑账号</button>`;
    card.querySelector('.js-unbind').addEventListener('click', unbindAccount);
  }

  // ---------- 内嵌绑定表单（方案 4：免跳转对话框，绑定成功免刷新直接用） ----------
  function setupBindForm(card) {
    const form = card.querySelector('#bindForm');
    const msgEl = card.querySelector('#bindMsg');
    const btn = card.querySelector('#bindSubmitBtn');
    // 密码可见性切换（掩码 ↔ 明文，方便核对输入；type=button 防误触发表单提交）
    const pwdInput = card.querySelector('#bindPassword');
    const pwdToggle = card.querySelector('.pwd-toggle');
    if (pwdToggle && pwdInput) {
      pwdToggle.addEventListener('click', () => {
        const show = pwdInput.type === 'password';
        pwdInput.type = show ? 'text' : 'password';
        pwdToggle.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
        pwdToggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        pwdToggle.title = show ? '隐藏密码' : '显示密码';
      });
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.textContent = '';
      msgEl.className = 'form-msg';
      const username = card.querySelector('#bindUsername').value.trim();
      const password = card.querySelector('#bindPassword').value;
      const pushplus = card.querySelector('#bindPushplus').value.trim();
      const remember = card.querySelector('#bindRemember').checked;
      if (!username || !password) {
        msgEl.textContent = '请填写学号和密码';
        msgEl.classList.add('form-msg-error');
        return;
      }
      btn.disabled = true;
      btn.textContent = '验证中…';
      try {
        const resp = await apiPost('/api/bind', {
          uid: window.LibPanel.UID, username, password, remember, pushplus,
        });
        if (resp && resp.redirected) {
          // 兜底（/api/bind 已在 shared.js 直连白名单中，正常不会走到）
          msgEl.textContent = '当前环境不支持直连，请在对话框输入「绑定账号」';
          msgEl.classList.add('form-msg-error');
          return;
        }
        if (resp && resp.code === 0) {
          // token 生命周期起点：立即生效（内存 + localStorage 持久化），
          // 后续请求自动经 /api/auth/exchange 换短时效凭证，无需刷新页面
          setToken(resp.token || '');
          renderBindSuccess(card, resp);
        } else {
          msgEl.textContent = (resp && resp.msg) || '绑定失败';
          msgEl.classList.add('form-msg-error');
        }
      } catch (err) {
        msgEl.textContent = err.message || '网络错误，请稍后重试';
        msgEl.classList.add('form-msg-error');
      } finally {
        btn.disabled = false;
        btn.textContent = '绑定';
      }
    });
  }

  // ---------- 绑定成功页（2026-08-24 移除 token 展示与"粘贴到 URL"指令） ----------
  // 该指令是 v18 前旧方案残留：平台内终端用户无法修改任务流 iframe URL（管理员静态模板），
  // 且 setToken 已自动完成 localStorage 存储——token 从未需要手动放置。
  // 跨设备正确路径 = 在新设备重新绑定（upsert 自动轮换旧 token）。
  // URL ?token= 解析能力保留在 shared.js（独立浏览器直开/调试场景），UI 不再广告。
  function renderBindSuccess(card, resp) {
    card.innerHTML = `
      <div class="card-header">${ICONS.user} 账号状态</div>
      <div class="alert alert-success">
        <span>${ICONS.check}</span>
        <div>绑定成功（${escapeHtml(resp.maskedName || '')}），凭证已自动生效</div>
      </div>
      <div style="margin-top:10px;font-size:var(--text-sm);color:var(--color-text-secondary);">
        凭证已自动保存在本浏览器，无需任何手动配置——本页面与左侧面板均可直接使用，
        下次打开免重复绑定。在其他设备使用时，对我说「绑定账号」重新绑定即可。
      </div>
      <button class="btn btn-block" id="bindDoneBtn" style="margin-top:12px;">完成</button>`;
    card.querySelector('#bindDoneBtn').addEventListener('click', async () => {
      await refreshAll();
      // 点「完成」回到常规卡片（已绑定视图 ~200px）——login 模式嵌入时同步下调 iframe 高度
      if (MODE === 'login' && window.LibPanel.resizeIframe) {
        window.LibPanel.resizeIframe(400, 260);
      }
    });
    // 绑定成功视图（~260px，token 展示已移除）比表单视图（~440px）矮——login 模式嵌入时主动下调
    if (MODE === 'login' && window.LibPanel.resizeIframe) {
      window.LibPanel.resizeIframe(400, 300);
    }
  }

  // ---------- 解绑（token 生命周期终点：清内存 + localStorage） ----------
  async function unbindAccount() {
    if (!confirm('确定解绑账号吗？解绑后将无法使用预约/抢座功能。')) return;
    try {
      const resp = await apiPost('/api/unbind', { uid: window.LibPanel.UID });
      if (resp && resp.redirected) {
        alert('已转向对话区，请在对话框完成解绑操作');
        return;
      }
      if (resp && resp.code === 0) {
        clearToken();  // 清除本地长期凭证与短时效缓存，下次会话从零开始
        await refreshAll();
      } else {
        alert('解绑失败: ' + (resp ? resp.msg : '未知错误'));
      }
    } catch (e) {
      alert('解绑失败: ' + e.message);
    }
  }

  // ---------- 查询我的预约（引导对话） ----------
  window.askReservations = function() {
    sendToParent(MSG.TRIGGER_TASK, { flow: 'chat', message: '我的预约' });
  };

  // ---------- 刷新所有数据 ----------
  async function refreshAll() {
    try {
      const [statusResp] = await Promise.allSettled([
        apiGet('/api/status'),
      ]);

      // 修复 P1-2：rejected 时把错误信息包装成 {code:-1, msg} 传给渲染函数，
      // 让用户看到具体原因（如「403：签名或 Token 校验失败（uid=test_user, token_len=0）」）
      // 而不是误导性的「无法连接服务器」
      const statusData = statusResp.status === 'fulfilled'
        ? statusResp.value
        : { code: -1, msg: (statusResp.reason && statusResp.reason.message) || '网络错误' };

      // 直接传整个响应对象给渲染函数（不是 .data）
      renderAccount(statusData);
    } catch (e) {
      console.error('刷新失败:', e);
      renderAccount(null);
    }
  }

  // ---------- 监听父窗口消息 ----------
  onParentMessage({
    [MSG_FROM_PARENT.REFRESH]: () => refreshAll(),
    [MSG_FROM_PARENT.DATA_SYNC]: (payload) => {
      if (payload && ['bound', 'unbound', 'reserved'].includes(payload.type)) {
        refreshAll();
      }
    },
  });

  // ---------- 初始化 ----------
  // 设置预约区图标
  document.getElementById('reservationIcon').innerHTML = ICONS.list;

  // 修复 P1-5：reservation 用事件委托
  document.querySelector('.js-reservation-trigger').addEventListener('click', () => askReservations());

  refreshAll();

  // 自动刷新策略：使用 Page Visibility API，仅在页面可见时刷新
  // 避免用户切到其他页签时浪费 FC 调用次数
  let refreshTimer = null;

  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(refreshAll, 60000);
    // 跨 iframe 凭证秒级同步（2026-08-24）：同一 Pages origin 的多个 iframe
    // （对话内嵌登录面板 / 右侧常驻面板）共享 localStorage，storage 事件在
    // 写入方之外的其他同源窗口触发——绑定 setToken / 解绑 clearToken 时，
    // 其他面板立即感知并自动刷新（60s 轮询作为兜底）
    window.addEventListener('storage', (e) => {
      if (e.key && e.key.startsWith('libpanel_token_')) {
        // 跨 iframe 凭证同步（2026-08-25）：本面板若在绑定前加载，TOKEN 快照为空，
        // 直接 refreshAll 会对带鉴权的接口发无凭证请求 → 403
        // （status 是白名单不受影响，故账号卡片显示已绑定而查询卡片报错）。
        // 先重读 localStorage 的 token 再刷新数据。
        window.LibPanel.reloadCredential();
        refreshAll();
      }
    });
  }

  function stopAutoRefresh() {
    if (refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  }

  // 页面可见时开始刷新，隐藏时停止
  if (document.hidden !== undefined) {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAutoRefresh();
      } else {
        // 重新可见时立即刷新一次，再启动定时器
        refreshAll();
        startAutoRefresh();
      }
    });
  }

  // 初始启动（如果页面可见）
  if (!document.hidden) startAutoRefresh();
})();
</script>
</body>
</html>
