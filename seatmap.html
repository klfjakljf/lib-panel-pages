<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动座位图</title>
<link rel="stylesheet" href="shared.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #f5f7fa; padding: 8px; }
  .page-shell { max-width: 1200px; margin: 0 auto; }

  .top-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .top-bar button { background: #3b82f6; color: #fff; border: 0; padding: 5px 10px; border-radius: 6px;
                    cursor: pointer; font-size: 12px; }
  .top-bar button:hover { background: #2563eb; }
  .top-bar .status { margin-left: auto; font-size: 11px; color: #94a3b8; }

  .breadcrumb { display: flex; gap: 4px; align-items: center; font-size: 13px; color: #64748b; margin-bottom: 6px; }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: #2563eb; }
  .breadcrumb .sep { color: #cbd5e1; cursor: default; }
  .breadcrumb .current { color: #1e293b; font-weight: 600; }

  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  select { padding: 6px 8px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 13px; max-width: 44vw; background: #fff; }
  .occ { font-size: 12px; color: #555; }
  .updated { font-size: 11px; color: #999; margin-left: auto; }

  /* 核心渲染容器：等比图片 + 绝对定位 Overlay */
  .seatmap-wrap {
    position: relative;
    width: 100%;
    background: #fff;
    border: 1px solid #e4e7ec;
    border-radius: 10px;
    overflow: hidden;
  }
  /* 取景框内层：宽度收缩到图片实际渲染宽度，
     座位百分比坐标与 cqw 单位都以图片实际显示区为基准 → 取景模式下坐标零偏移。
     注意：container-type 不能挂在这层——inline-size 包含会让 width:fit-content
     忽略图片宽度而塌缩为 0，改挂在 overlay 上（宽度恒为 100%，无此问题） */
  .seatmap-frame {
    position: relative;
    width: 100%;
  }
  /* 取景框模式（一楼E区/数字化区等特殊房间）：限高 + 居中，防止超尺寸图片撑爆 iframe */
  .seatmap-wrap.framed { display: flex; justify-content: center; }
  .seatmap-wrap.framed .seatmap-frame { width: fit-content; max-width: 100%; }
  .seatmap-wrap.framed .seatmap-bg { max-height: 65vh; width: auto; max-width: 100%; height: auto; }
  .seatmap-bg {
    width: 100%;
    height: auto;
    display: block;
  }
  .seatmap-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    container-type: inline-size;  /* .seat 的 cqw 基准 = 图片实际渲染宽度 */
  }
  .seat {
    position: absolute;
    /* 官网实测：坐标 = 圆点外框【左上角】，不做居中偏移 */
    /* 尺寸随图宽等比（官网 815px 宽时圆点 10px ≈ 图宽 1.23%）；
       略收紧到 1.15%，保证密排走廊（行距小）圆点不相碰、不压桌边。
       取景框房间（一楼E区/111数字化区）经 setFramed() 注入更大的
       --seat-size/--num-size（按官网 pointSize/textSize 比例换算） */
    width: var(--seat-size, 1.15cqw);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .seat:hover { transform: scale(1.2); z-index: 10; }
  /* 配色对齐官网：空闲绿 / 部分占用半绿半黄 / 占用黄 / 我的蓝 / 未开放深灰 */
  .s0 { background: #50ac33; }
  .s1 { background: linear-gradient(90deg, #50ac33 50%, #ffc835 0); }
  .s2 { background: #ffc835; }
  .s3 { background: #3b82f6; }
  .s4 { background: #646464; }
  .seat.sel { outline: 0.18cqw solid #111827; transform: scale(1.25); z-index: 5; }
  /* 座位号置于圆点【下方】（对齐官网 em 布局），字高随图宽等比 */
  .seat .num {
    position: absolute; top: 110%; left: 50%;
    transform: translateX(-50%);
    font-size: var(--num-size, 0.55cqw); line-height: 1.2;
    color: #111; white-space: nowrap;
    pointer-events: none;
  }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 11px; color: #64748b; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }

  /* 未绑定 / 加载失败 视图 */
  .state-view { display: none; background: #fff; border: 1px solid #e4e7ec; border-radius: 10px;
                padding: 28px 16px; text-align: center; }
  .state-view h3 { font-size: 15px; color: #1e293b; margin-bottom: 8px; }
  .state-view p { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 14px; }
  .state-view button { background: #2563eb; color: #fff; border: 0; padding: 9px 22px;
                       border-radius: 8px; font-size: 14px; cursor: pointer; }
  .state-view button:hover { background: #1d4ed8; }

  #panel { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 14px 14px 0 0;
           box-shadow: 0 -4px 20px #0002; padding: 14px; display: none; max-height: 55vh; overflow-y: auto; z-index: 20; }
  #panel h3 { font-size: 15px; margin-bottom: 8px; }
  .slot { display: inline-block; background: #fee2e2; color: #b91c1c; border-radius: 5px;
          padding: 3px 8px; margin: 3px 4px 3px 0; font-size: 12px; }
  .free { color: #16a34a; font-size: 13px; }

  /* 座位预约时间轴（对齐官网：横条可视化占用） */
  .tl-label { font-size: 12px; color: #475569; margin-bottom: 4px; }
  .tl { position: relative; height: 16px; border-radius: 4px; background: #dcfce7; margin: 4px 0 2px; }
  .tl .seg { position: absolute; top: 0; bottom: 0; background: #ef4444; z-index: 2; }
  .tl .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.12); z-index: 1; }
  .tl .tick.hour { background: rgba(0,0,0,0.22); }
  .tl-ends { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; }
  .tl-ticks { position: relative; height: 13px; margin-top: 1px; }
  .tl-ticks span { position: absolute; transform: translateX(-50%); font-size: 9px; color: #94a3b8; line-height: 13px; }
  .tl-slots { font-size: 11px; color: #b91c1c; margin: 3px 0 0; line-height: 1.6; }
  .tl-legend { font-size: 11px; color: #64748b; margin: 2px 0 6px; }
  .tl-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin: 0 3px 0 8px; vertical-align: -1px; }

  /* 预约规则 */
  .rules { font-size: 11px; color: #64748b; background: #f8fafc; border: 1px dashed #e2e8f0;
           border-radius: 6px; padding: 6px 8px; margin: 8px 0; line-height: 1.7; }

  /* 日期选择（今天/明天 chips）——图书馆系统仅支持提前 0-1 天预约 */
  .day-row { display: flex; gap: 6px; margin: 8px 0 0; }
  .day-chip { flex: 1; padding: 6px 0; text-align: center; font-size: 13px; color: #475569;
              background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px;
              cursor: pointer; transition: all 0.15s ease; user-select: none; }
  .day-chip.on { background: #eff6ff; border-color: #2563eb; color: #1d4ed8; font-weight: 600; }

  /* 时段选择（双下拉，对齐官网范式） */
  .period-row { display: flex; gap: 6px; align-items: center; margin: 8px 0 2px; font-size: 13px; color: #334155; }
  .period-row select { flex: 1; max-width: none; }
  #pErr { color: #dc2626; font-size: 12px; min-height: 16px; margin-top: 4px; }
  #pickBtn { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 8px;
             background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  #pickBtn:hover { background: #1d4ed8; }
  #closeBtn { position: absolute; top: 8px; right: 12px; border: 0; background: none; font-size: 18px; color: #999; cursor: pointer; }
</style>
</head>
<body>

<div class="page-shell">

<div class="top-bar">
  <button onclick="forceRefresh()">刷新</button>
  <button onclick="goFullscreen()" title="超星嵌入时 iframe 宽度会被压缩，全屏查看体验最佳">全屏查看</button>
  <span class="status" id="testStatus">加载中...</span>
</div>

<div class="breadcrumb" id="breadcrumb">
  <span onclick="goHome()">座位图</span>
  <span class="sep">/</span>
  <span class="current">请选择楼层</span>
</div>

<div class="bar">
  <select id="floorSel" onchange="onFloor()"></select>
  <select id="roomSel" onchange="onRoom()"></select>
  <span class="occ" id="occ"></span>
  <span class="updated" id="updated"></span>
</div>

<div class="seatmap-wrap" id="seatmapWrap">
  <div class="seatmap-frame">
    <img class="seatmap-bg" id="bgImg" src="" alt="楼层平面图" style="display:none">
    <div class="seatmap-overlay" id="overlay"></div>
  </div>
</div>

<div class="legend">
  <span><i style="background:#50ac33"></i>空闲</span>
  <span><i style="background:linear-gradient(90deg,#50ac33 50%,#ffc835 0)"></i>部分时段已约</span>
  <span><i style="background:#ffc835"></i>当前已约</span>
  <span><i style="background:#3b82f6"></i>我的预约</span>
  <span><i style="background:#646464"></i>未开放</span>
</div>

<!-- 未绑定引导 -->
<div class="state-view" id="unboundView">
  <h3>尚未绑定图书馆账号</h3>
  <p>查看实时座位状态需要先绑定账号。<br>点击下方按钮，按对话提示输入学号与图书馆密码完成绑定。</p>
  <button onclick="LibPanel.triggerFlow('bind')">去绑定账号</button>
</div>

<!-- 加载失败 -->
<div class="state-view" id="errorView">
  <h3 id="errTitle">加载失败</h3>
  <p id="errMsg"></p>
  <button onclick="init()">重试</button>
</div>

</div><!-- /page-shell -->

<div id="panel">
  <button id="closeBtn" onclick="panel.style.display='none'">✕</button>
  <h3 id="pTitle"></h3>
  <div class="tl-label">座位预约时间</div>
  <div class="tl" id="pTimeline"></div>
  <div class="tl-ends" id="tlEnds"></div>
  <div class="tl-ticks" id="tlTicks"></div>
  <div class="tl-slots" id="tlSlots"></div>
  <div class="tl-legend"><i style="background:#ef4444"></i>已约<i style="background:#dcfce7;border:1px solid #d1d5db"></i>可预约</div>
  <div class="rules">预约规则：当日开放 08:30–22:15；提前预约范围 0–1 天；单次预约时长 60–240 分钟。</div>
  <div class="day-row">
    <div class="day-chip on" id="dayToday" onclick="setPickDay(0)">今天</div>
    <div class="day-chip" id="dayTomorrow" onclick="setPickDay(1)">明天</div>
  </div>
  <div class="period-row">
    开始 <select id="selStart"></select>
    结束 <select id="selEnd"></select>
  </div>
  <div id="pErr"></div>
  <div id="pFree"></div>
  <button id="pickBtn">预约这个座位</button>
</div>

<script src="shared.js"></script>
<script>
const { apiGet, sendToParent, MSG, triggerFlow, hasCredential,
        requestIframeFullscreen, resizeIframe } = window.LibPanel;

let tree = [], curFloorId = null, curRoom = null, curRoomName = null;
let roomSeats = [], sel = null, timer = null;
let pickDay = 0;  // 预约日期：0=今天 1=明天（图书馆系统仅支持提前 0-1 天）

// 图片统一收纳在 img/ 目录（相对页面路径）
const IMG_DIR = 'img/';

// 楼层节点名（"图书馆一楼学习中心"/"图书馆二楼"/"1楼"）→ 楼层号，用于匹配 floorN.jpg
function floorNumFromName(name) {
  const m = (name || '').match(/([一二三四五六七八九十]|\d)\s*楼/);
  if (!m) return null;
  const c2n = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
  const n = c2n[m[1]] !== undefined ? c2n[m[1]] : parseInt(m[1], 10);
  return isNaN(n) ? null : n;
}

// 归一化 /api/rooms 返回的空间树：
// 1) 真实接口是 校区→楼层→房间 三级——检测到校区层就下钻取大学城的楼层
// 2) 桂花岗校区数据/房间图未收集（后置），琴房等无楼层号的节点一并过滤
// 3) 楼层节点附 floorNum（平面图文件名）与 shortName（下拉/面包屑显示）
function normalizeTree(raw) {
  let t = raw || [];
  if (t.length && t.some(x => (x.name || '').includes('校区'))) {
    const dxc = t.find(x => (x.name || '').includes('大学城')) || t[0];
    t = (dxc && dxc.children) || [];
  }
  t = t.filter(f => floorNumFromName(f.name) !== null);
  for (const f of t) {
    f.floorNum = floorNumFromName(f.name);
    f.shortName = '一二三四五六七八九'[f.floorNum - 1] + '楼';
  }
  return t;
}

// 楼层平面图地址：按楼层号匹配 img/floorN.jpg
// （楼层 id 是图书馆系统大数如 100595328，不能直接拼进文件名）
function floorImgSrc() {
  const f = (tree || []).find(t => t.id === curFloorId);
  return IMG_DIR + 'floor' + ((f && f.floorNum) || curFloorId) + '.jpg';
}

// 房间名 → 图片文件名映射（文件名统一小写：GitHub Pages 区分大小写，
// 房间名"C区/A区"里的大写字母拼接时必须 toLowerCase，否则 404）
// 特殊规则在前（511 拆两区、现刊阅览室=306+307 合并图、1 楼非编号房间）
function getRoomImage(roomName) {
  const SPECIAL = {
    '^511室-1': 'room511a.jpg',
    '^511室-2': 'room511b.jpg',
    '^3楼现刊': 'room306307.jpg',
    '^一楼E': 'room1e.jpg',
    '^111': 'room111.jpg',
  };
  for (const [pat, img] of Object.entries(SPECIAL)) {
    if (new RegExp(pat).test(roomName)) return img;
  }
  let m = roomName.match(/^(\d{3})/);
  if (m) return `room${m[1]}.jpg`;
  m = roomName.match(/^(\d)楼.*（([A-Za-z])区/);
  if (m) return `room${m[1]}${m[2].toLowerCase()}.jpg`;
  return null;
}

// 图书馆系统的座位坐标是相对完整图片的百分比，overlay 直接覆盖完整图片（CSS 默认 100%x100%），
// 不做任何白边收缩，否则会引入系统性偏移。

// ──────────── 取景框模式（一楼E区 / 111数字化学习区） ────────────
// 两房间原图远大于其他房间图（room1e 1200×860、room111 776×900 竖图），
// 宽度撑满时高度会撑爆 iframe → .framed 限高 65vh + 居中。
// 座位点/字号按官网 pointSize/textSize 与图宽的比例换算（其他房间用 CSS 默认值）：
//   一楼E区：point 16/1200 ≈ 1.33cqw，text 10/1200 ≈ 0.83cqw
//   111数字化：point 12/776 ≈ 1.55cqw，text 12/776 ≈ 1.55cqw
const FRAMED_ROOMS = {
  '^一楼E': { seat: '1.33cqw', num: '0.83cqw' },
  '^111数字化': { seat: '1.55cqw', num: '1.55cqw' },
};
function setFramed(roomName) {
  let cfg = null;
  if (roomName) {
    for (const [pat, c] of Object.entries(FRAMED_ROOMS)) {
      if (new RegExp(pat).test(roomName)) { cfg = c; break; }
    }
  }
  document.getElementById('seatmapWrap').classList.toggle('framed', !!cfg);
  const frame = document.querySelector('.seatmap-frame');
  // 置空 = 移除变量，回落到 CSS 默认（1.15cqw / 0.55cqw）
  frame.style.setProperty('--seat-size', cfg ? cfg.seat : '');
  frame.style.setProperty('--num-size', cfg ? cfg.num : '');
}

// ──────────── API（走 shared.js 鉴权链：st_token > token，8 秒超时） ────────────
async function api(path, query) {
  try {
    return await apiGet(path, query);
  } catch (e) {
    // 401 = 未绑定 / 凭证失效；其余按错误透出
    return { code: e.status || -1, msg: e.message || '网络错误' };
  }
}

// ──────────── 视图切换辅助 ────────────
function showMain() {
  document.getElementById('unboundView').style.display = 'none';
  document.getElementById('errorView').style.display = 'none';
  document.querySelector('.bar').style.display = '';
  document.querySelector('.seatmap-wrap').style.display = '';
  document.querySelector('.legend').style.display = '';
}
function showUnbound() {
  document.getElementById('unboundView').style.display = 'block';
  document.querySelector('.bar').style.display = 'none';
  document.querySelector('.seatmap-wrap').style.display = 'none';
  document.querySelector('.legend').style.display = 'none';
  document.getElementById('testStatus').textContent = '未绑定';
}
function showError(msg) {
  document.getElementById('errTitle').textContent = '加载失败';
  document.getElementById('errMsg').textContent = msg || '请稍后重试';
  document.getElementById('errorView').style.display = 'block';
  document.querySelector('.bar').style.display = 'none';
  document.querySelector('.seatmap-wrap').style.display = 'none';
  document.querySelector('.legend').style.display = 'none';
  document.getElementById('testStatus').textContent = '加载失败';
}

// ──────────── 面包屑 ────────────
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const floorSel = document.getElementById('floorSel');
  const roomSel = document.getElementById('roomSel');
  const floorName = floorSel.value !== '' ? (tree[+floorSel.value] || {}).shortName : null;
  const roomName = roomSel.value ? roomSel.options[roomSel.selectedIndex]?.text : null;

  let html = '<span onclick="goHome()">座位图</span>';
  if (floorName) {
    html += '<span class="sep">/</span><span onclick="goFloor()">' + floorName + '</span>';
  }
  if (roomName) {
    html += '<span class="sep">/</span><span class="current">' + roomName.split('（')[0] + '</span>';
  } else if (floorName) {
    html += '<span class="sep">/</span><span class="current">全部房间</span>';
  } else {
    html += '<span class="sep">/</span><span class="current">请选择楼层</span>';
  }
  bc.innerHTML = html;
}

function goHome() {
  document.getElementById('floorSel').value = '';
  document.getElementById('roomSel').innerHTML = '<option value="">选择楼层后显示房间</option>';
  curFloorId = null; curRoom = null;
  roomSeats = [];
  document.getElementById('bgImg').style.display = 'none';
  setFramed(null);
  document.getElementById('overlay').innerHTML = '';
  document.getElementById('occ').textContent = '';
  document.getElementById('updated').textContent = '';
  clearInterval(timer);
  updateBreadcrumb();
}

// 楼层统计文案：楼层视图不再渲染占用率标注/座位数据，统计直接来自 /api/rooms 树
function floorStatText() {
  const f = (tree || []).find(t => t.id === curFloorId);
  return f ? `本层共 ${f.total} 座 · 剩余 ${f.remain}` : '';
}

function goFloor() {
  curRoom = null;
  curRoomName = null;
  document.getElementById('roomSel').value = '';
  roomSeats = [];
  setFramed(null);
  const bgImg = document.getElementById('bgImg');
  if (curFloorId) {
    bgImg.style.display = 'block';
    bgImg.src = floorImgSrc();
  }
  renderSeats();
  document.getElementById('occ').textContent = floorStatText();
  clearInterval(timer);
  updateBreadcrumb();
}

// ──────────── 初始化 ────────────
async function init() {
  showMain();
  document.getElementById('testStatus').textContent = '加载中...';
  const r = await api('/api/rooms', { type: 'seat' });
  // 401 = 后端判定未绑定；403 = 无凭证/凭证失效（直访、换设备、token 轮换）→ 统一引导绑定
  if (r.code === 401 || r.code === 403) { showUnbound(); return; }
  if (r.code !== 0) { showError(r.msg); return; }
  tree = normalizeTree(r.tree || []);
  document.getElementById('testStatus').textContent = '就绪';
  const fs = document.getElementById('floorSel');
  fs.innerHTML = '<option value="">选择楼层</option>' +
    tree.map((f, i) => `<option value="${i}">${f.shortName}（余${f.remain}）</option>`).join('');
  updateBreadcrumb();
}

async function onFloor() {
  const fi = document.getElementById('floorSel').value;
  if (fi === '') { goHome(); return; }
  const f = tree[+fi];
  curFloorId = f.id;
  curRoom = null;

  // 加载房间列表
  const rs = document.getElementById('roomSel');
  rs.innerHTML = '<option value="">全部房间</option>' +
    (f.children || []).map(r => `<option value="${r.id}">${r.name}（余${r.remain}）</option>`).join('');

  // 加载楼层平面图
  const bgImg = document.getElementById('bgImg');
  bgImg.style.display = 'block';
  bgImg.src = floorImgSrc();
  bgImg.onerror = function() { this.style.display = 'none'; };
  setFramed(null);

  // 切到楼层视图：立即清场——上一房间的座位圆点是房间图内部坐标系，
  // 残留在楼层平面图上就是"满屏乱点"；同时停掉房间轮询定时器
  // 楼层视图只展示平面图 + 树统计（不再请求楼层座位/渲染占用率）
  sel = null;
  roomSeats = [];
  clearInterval(timer);
  document.getElementById('overlay').innerHTML = '';
  document.getElementById('updated').textContent = '';
  document.getElementById('occ').textContent = floorStatText();
  updateBreadcrumb();
}

async function onRoom() {
  const roomId = +document.getElementById('roomSel').value || null;
  if (!roomId) {
    curRoom = null;
    curRoomName = null;
    roomSeats = [];
    setFramed(null);  // 回到楼层图：退出取景框
    const bgImg = document.getElementById('bgImg');
    if (curFloorId) {
      bgImg.src = floorImgSrc();
    }
    renderSeats();
    document.getElementById('occ').textContent = floorStatText();
    clearInterval(timer);
    updateBreadcrumb();
    return;
  }
  curRoom = roomId;
  // 从 select 获取房间名：只去尾部「（余x）」，保留「（A区）（C区）」等区域后缀，
  // 否则走廊类房间 getRoomImage 无法匹配，会残留显示上一个房间/楼层的地图
  const roomSel = document.getElementById('roomSel');
  curRoomName = roomSel.options[roomSel.selectedIndex]?.text?.replace(/（余\d+）\s*$/, '') || '';

  // 加载房间专属图片
  // 若缺图：保持楼层图为背景但【不渲染座位圆点】——房间坐标是房间内部坐标系，
  // 画在楼层图上会满屏乱点，只提示缺图
  const bgImg = document.getElementById('bgImg');
  const roomImg = getRoomImage(curRoomName);
  window._missingRoomImg = !roomImg;
  if (roomImg) {
    bgImg.src = IMG_DIR + roomImg;
    // 取景框模式：一楼E区/111数字化学习区（超大图限高居中，座位点/字号按官网比例调大）
    setFramed(curRoomName);
    bgImg.onerror = function() {
      this.onerror = null;
      this.src = floorImgSrc();
      setFramed(null);  // 图片 404 回落楼层图：退出取景框
      window._missingRoomImg = true;
      showMissingImage();
    };
  } else {
    setFramed(null);  // 缺图保持楼层图：退出取景框
    showMissingImage();
  }
  function showMissingImage() {
    document.getElementById('occ').textContent = `⚠️ ${curRoomName} 缺少房间平面图`;
    document.getElementById('overlay').innerHTML = '';
  }

  // 请求前清空旧座位：房间坐标是各自图片的内部坐标系，
  // 旧房间座位点残留在新房间图上会坐标系错配（加载间隙也会乱点）
  document.getElementById('overlay').innerHTML = '';
  document.getElementById('testStatus').textContent = '加载座位...';

  // 守卫：快速切换房间时丢弃过期响应，避免旧房间数据覆盖当前房间
  const reqRoom = roomId;
  // 切房间重置为今天（房间切换与日期 chips 独立，新房间从今天的占用看起）
  pickDay = 0;
  document.getElementById('dayToday').classList.add('on');
  document.getElementById('dayTomorrow').classList.remove('on');
  const r = await api('/api/seatmap/snapshot', { roomId, day: 0 });
  if (curRoom !== reqRoom) return;  // 已切到其他房间/视图
  if (r.code === 401 || r.code === 403) {
    document.getElementById('testStatus').textContent = '凭证失效';
    document.getElementById('occ').textContent = '凭证已失效，请刷新页面或重新绑定';
    clearInterval(timer);
    return;
  }
  if (r.code !== 0) {
    document.getElementById('occ').textContent = '座位数据加载失败：' + (r.msg || '');
    return;
  }
  roomSeats = r.seats || [];
  roomSeatsDay = 0;
  if (window._missingRoomImg) {
    // 缺图：不渲染座位（防止坐标系错配满屏乱点），仅提示
    document.getElementById('overlay').innerHTML = '';
    clearInterval(timer);
    updateBreadcrumb();
    return;
  }
  const occ = roomSeats.filter(s => s.state === 1 || s.state === 2 || s.state === 3).length;
  document.getElementById('occ').textContent = `占用 ${occ}/${roomSeats.length}`;
  document.getElementById('updated').textContent = '更新于 ' + (r.updatedAt || '');
  document.getElementById('testStatus').textContent = '就绪';
  renderSeats();
  clearInterval(timer);
  timer = setInterval(() => loadRoomSeats(), 30000);
  updateBreadcrumb();
}

// roomSeatsDay：当前 roomSeats 数据所属日期（0今天/1明天）。
// 面板里 pick() 持有的座位对象 s 是旧数组引用，轮询/切日期整体替换数组后
// 必须重新取引用并刷新面板，否则时间轴与下拉停留在旧数据
let roomSeatsDay = 0;

async function loadRoomSeats(day) {
  if (!curRoom) return;
  if (day === undefined) day = pickDay;
  const reqRoom = curRoom;
  const reqDay = day;
  const r = await api('/api/seatmap/snapshot', { roomId: curRoom, day: day, _t: Date.now() });
  // 守卫：响应回来时已切房间或切日期，丢弃（防旧数据覆盖）
  if (curRoom !== reqRoom || pickDay !== reqDay) return;
  if (r.code !== 0) return;
  roomSeats = r.seats || [];
  roomSeatsDay = day;
  const occ = roomSeats.filter(s => s.state === 1 || s.state === 2 || s.state === 3).length;
  const dayText = day === 1 ? '明日' : '';
  document.getElementById('occ').textContent = `${dayText}占用 ${occ}/${roomSeats.length}`;
  document.getElementById('updated').textContent = '更新于 ' + (r.updatedAt || '');
  renderSeats();
  // 面板打开时同步刷新时间轴/时段下拉（重新取座位引用）
  if (sel && document.getElementById('panel').style.display === 'block') {
    const s = roomSeats.find(x => x.name === sel);
    if (s) {
      renderTimeline(s);
      renderPeriodPicker(s);
    }
  }
}

// ──────────── 渲染 ────────────
function renderSeats() {
  const overlay = document.getElementById('overlay');
  if (curRoom) {
    // 房间模式：渲染房间内座位圆点
    const html = roomSeats
      .filter(s => s.x !== null && s.y !== null)
      .map(s => {
        const label = (s.name || '').split('-')[1] || s.name;
        const selClass = sel === s.name ? ' sel' : '';
        const left = parseFloat(s.x).toFixed(2);
        const top = parseFloat(s.y).toFixed(2);
        return `<div class="seat s${s.state}${selClass}"
                     style="left:${left}%;top:${top}%"
                     onclick="pick('${s.name}')"
                     title="${s.name}"><span class="num">${label}</span></div>`;
      }).join('');
    overlay.innerHTML = html;
  } else {
    // 楼层/首页模式：仅平面图，无座位圆点、无占用率标注
    overlay.innerHTML = '';
  }
}

function forceRefresh() {
  if (curRoom) {
    document.getElementById('testStatus').textContent = '刷新中...';
    loadRoomSeats();
  } else if (curFloorId) {
    init();
  }
}

function goFullscreen() {
  requestIframeFullscreen();
}

// ──────────── 座位点击 ────────────
// 预约规则常量（对齐图书馆系统）
const OPEN_DEFAULT = ['08:30', '22:15'];  // 当日开放
const STEP = 5;      // 时段粒度：5 分钟（与官网下拉一致）
const MIN_DUR = 60;  // 单次预约最短 60 分钟
const MAX_DUR = 240; // 单次预约最长 240 分钟

const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const toHHMM = min => String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');

// 座位开放时间：起止相同（如 08:00~08:00）视为全天，用规则默认值兜底
function seatOpen(s) {
  if (s.open && s.open[0] && s.open[1] && s.open[0] !== s.open[1]) return s.open;
  return OPEN_DEFAULT;
}

// ── 座位预约时间轴（横条：红=已约，绿底=可约）──
// v2：整点主刻度 + 半点次刻度 + 整点数字标尺 + 恢复已约时段数字显示
function renderTimeline(s) {
  const [os, oe] = seatOpen(s);
  const o0 = toMin(os), o1 = toMin(oe);
  const total = o1 - o0;
  const tl = document.getElementById('pTimeline');
  let html = '';
  // 半小时次刻度（浅）
  for (let t = o0 - (o0 % 30) + 30; t < o1; t += 30) {
    const pct = ((t - o0) / total) * 100;
    html += `<div class="tick" style="left:${pct}%"></div>`;
  }
  // 整点主刻度（深）
  for (let t = o0 - (o0 % 60) + 60; t < o1; t += 60) {
    const pct = ((t - o0) / total) * 100;
    html += `<div class="tick hour" style="left:${pct}%"></div>`;
  }
  // 已约段（最上层）
  (s.slots || []).forEach(([a, b]) => {
    const l = ((toMin(a) - o0) / total) * 100;
    const w = ((toMin(b) - toMin(a)) / total) * 100;
    if (w > 0) html += `<div class="seg" style="left:${l}%;width:${w}%" title="已约 ${a} ~ ${b}"></div>`;
  });
  tl.innerHTML = html;
  document.getElementById('tlEnds').innerHTML = `<span>${os}</span><span>${oe}</span>`;
  // 整点数字标尺（首尾两端由 tlEnds 展示，避免重叠：从首个整点起标）
  const ticksEl = document.getElementById('tlTicks');
  if (ticksEl) {
    let th = '';
    for (let t = o0 - (o0 % 60) + 60; t < o1 - 20; t += 60) {
      const pct = ((t - o0) / total) * 100;
      th += `<span style="left:${pct}%">${toHHMM(t).slice(0, 2)}</span>`;
    }
    ticksEl.innerHTML = th;
  }
  // 恢复已约时段数字显示（当前 pickDay 日期对应的数据）
  const slotsEl = document.getElementById('tlSlots');
  if (slotsEl) {
    const sl = s.slots || [];
    slotsEl.innerHTML = sl.length
      ? '已约时段：' + sl.map(([a, b]) => `${a}-${b}`).join('、')
      : `${pickDay === 1 ? '明天' : '今天'}暂无预约，全程可约`;
  }
}

// ── 双下拉时段选择（对齐官网范式：开始+结束，约束前置）──
// 已约/已过时刻灰显不可选；结束下拉被 60-240 分钟时长 + 闭馆 + 下一已约段三重截断
// pickDay=1（明天）时解除"已过时刻"约束——明天的可约时刻不受当前时间限制
function renderPeriodPicker(s) {
  const selStart = document.getElementById('selStart');
  const selEnd = document.getElementById('selEnd');
  const [os, oe] = seatOpen(s);
  const openMin = toMin(os), closeMin = toMin(oe);
  const nowMin = pickDay === 0 ? (new Date().getHours() * 60 + new Date().getMinutes()) : -1;
  const busy = (s.slots || []).map(([a, b]) => [toMin(a), toMin(b)]).sort((x, y) => x[0] - y[0]);

  const nextBusyAfter = t => {  // t 时刻之后（含）的第一个已约段起点
    for (const [a] of busy) if (a > t) return a;
    return closeMin;
  };
  const inBusy = t => busy.some(([a, b]) => t >= a && t < b);

  function buildStart() {
    let first = null;
    let html = '';
    for (let t = openMin; t <= closeMin - MIN_DUR; t += STEP) {
      // 非法开始：已过时刻 / 落在已约段内 / 剩余可约时长不足 60 分钟
      const ok = t >= nowMin && !inBusy(t) && (Math.min(nextBusyAfter(t), closeMin) - t) >= MIN_DUR;
      html += `<option value="${toHHMM(t)}"${ok ? '' : ' disabled'}>${toHHMM(t)}</option>`;
      if (ok && first === null) first = toHHMM(t);
    }
    selStart.innerHTML = html || `<option value="">${pickDay ? '明天' : '今日'}无可约时段</option>`;
    selStart.value = first || '';
    buildEnd();
  }

  function buildEnd() {
    if (!selStart.value) { selEnd.innerHTML = ''; return; }
    const startMin = toMin(selStart.value);
    // 硬上限 = min(240分钟, 闭馆, 开始后的第一个已约段)
    const hardEnd = Math.min(startMin + MAX_DUR, closeMin, nextBusyAfter(startMin));
    let html = '';
    for (let t = startMin + MIN_DUR; t <= hardEnd; t += STEP) {
      html += `<option value="${toHHMM(t)}">${toHHMM(t)}</option>`;
    }
    selEnd.innerHTML = html || '<option value="">无可选结束时刻</option>';
    // 默认拉满到最晚合法时刻
    if (selEnd.options.length) selEnd.value = selEnd.options[selEnd.options.length - 1].value;
  }

  selStart.onchange = buildEnd;
  buildStart();
}

// 提交前校验：下拉约束的漏网（停留期间被抢/极端边角）在此兜底
function validatePeriod(s) {
  const selStart = document.getElementById('selStart');
  const selEnd = document.getElementById('selEnd');
  if (!selStart.value || !selEnd.value) return { ok: false, msg: `${pickDay ? '明天' : '今日'}无可约时段` };
  const a = toMin(selStart.value), b = toMin(selEnd.value);
  if (b - a < MIN_DUR) return { ok: false, msg: `预约时长不能少于 ${MIN_DUR} 分钟` };
  if (b - a > MAX_DUR) return { ok: false, msg: `预约时长不能超过 ${MAX_DUR} 分钟` };
  const clash = (s.slots || []).find(([x, y]) => a < toMin(y) && b > toMin(x));
  if (clash) return { ok: false, msg: `${clash[0]} ~ ${clash[1]} 已被占用` };
  return { ok: true, start: selStart.value, end: selEnd.value };
}

// 日期 chips 切换：重拉对应日期的占用快照（FC seat_list 的 resvDates 支持指定日期），
// 时间轴/时段下拉/占用统计全部随日期切换刷新
async function setPickDay(d) {
  if (pickDay === d) return;
  pickDay = d;
  document.getElementById('dayToday').classList.toggle('on', d === 0);
  document.getElementById('dayTomorrow').classList.toggle('on', d === 1);
  document.querySelector('.tl-label').textContent = d === 1 ? '座位预约时间（明天）' : '座位预约时间';
  document.getElementById('pErr').textContent = '';
  document.getElementById('pFree').textContent = '';
  // 先用现有引用立即重渲染下拉（解除/恢复"已过时刻"约束），同时拉取新日期数据
  const s0 = roomSeats.find(x => x.name === sel);
  if (s0) renderPeriodPicker(s0);
  if (d === 1 && roomSeatsDay === 1) return;  // 已是明天数据
  if (d === 0 && roomSeatsDay === 0) return;  // 已是今天数据
  document.getElementById('tlSlots').textContent = '加载中...';
  await loadRoomSeats(d);
}

function pick(name) {
  sel = name;
  const s = roomSeats.find(x => x.name === name);
  if (!s) return;
  renderSeats();
  // 每次选座重置为"今天"；若当前数据是明天的，需重拉今天占用
  pickDay = 0;
  document.getElementById('dayToday').classList.add('on');
  document.getElementById('dayTomorrow').classList.remove('on');
  if (roomSeatsDay === 1) loadRoomSeats(0);
  // 开放时间：起止相同视为全天（101/1E/111 等房间系统返回 08:00~08:00）
  let openText = `开放 ${OPEN_DEFAULT[0]}-${OPEN_DEFAULT[1]}`;
  if (s.open && s.open[0] && s.open[1] && s.open[0] !== s.open[1]) {
    openText = `开放 ${s.open[0]}-${s.open[1]}`;
  }
  document.getElementById('pTitle').textContent = `${name}（${openText}）`;
  document.getElementById('pErr').textContent = '';
  document.getElementById('pFree').textContent = '';
  document.querySelector('.tl-label').textContent = '座位预约时间';
  renderTimeline(s);
  renderPeriodPicker(s);
  document.getElementById('panel').style.display = 'block';

  const pickBtn = document.getElementById('pickBtn');
  if (!hasCredential()) {
    pickBtn.textContent = '绑定后即可预约';
    pickBtn.disabled = true;
    pickBtn.style.background = '#9ca3af';
    pickBtn.onclick = null;
    return;
  }
  pickBtn.textContent = '预约这个座位';
  pickBtn.disabled = false;
  pickBtn.style.background = '#2563eb';
  pickBtn.onclick = () => {
    const v = validatePeriod(s);
    if (!v.ok) {
      document.getElementById('pErr').textContent = v.msg;
      // 时段被抢则刷新时间轴与下拉
      renderTimeline(s);
      renderPeriodPicker(s);
      return;
    }
    // 选座回传：shared.js 转为 CXBOT 隐藏消息（devName + room + date + periods），
    // 由座位预约任务流的 normalize_input 解析后执行
    const date = new Date();
    if (pickDay === 1) date.setDate(date.getDate() + 1);  // 明天
    const ymd = `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`;
    const dayText = pickDay === 1 ? '明天' : '今天';
    sendToParent(MSG.SEAT_PICK, {
      seat: name, room: curRoomName,
      date: ymd, periods: [`${v.start}-${v.end}`],
    });
    document.getElementById('pErr').textContent = '';
    document.getElementById('pFree').textContent = `已发送预约请求（${dayText} ${v.start} ~ ${v.end}），请在对话中查看结果`;
    document.getElementById('testStatus').textContent = '已选座: ' + name;
  };
}

init();
</script>
